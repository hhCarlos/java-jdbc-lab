spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:${DB_PORT:1521}/FREEPDB1}
    username: store_jdbc
    password: ${DB_PASSWORD}
app:
  dev-db-reset: ${DEV_DB_RESET:false}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  paths-to-match: /users, /users/**, /auth/login, /auth/register
  override-with-generic-response: false
