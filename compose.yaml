services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim
    platform: linux/arm64
    ports:
      - "127.0.0.1:${DB_PORT:-1521}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env}
      APP_USER: ${ORACLE_BOOTSTRAP_USER:-jdbc_app}
      APP_USER_PASSWORD: ${ORACLE_BOOTSTRAP_PASSWORD:?Set ORACLE_BOOTSTRAP_PASSWORD in .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  oracle-data:
