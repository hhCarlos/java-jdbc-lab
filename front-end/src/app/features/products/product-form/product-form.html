<section class="product-form" aria-label="New product details">
  <p class="product-form__instructions">All fields except description are required. Saving products is not available yet.</p>
  <form class="product-form__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-input label="Title" inputId="product-title" formControlName="title" />
    <app-input label="Price" inputId="product-price" formControlName="price"
      inputMode="decimal" [errorMessages]="priceErrors" />
    <div class="product-form__field">
      <label class="product-form__label" for="product-description">Description (optional)</label>
      <textarea class="product-form__input" id="product-description" name="description" formControlName="description" rows="5"></textarea>
    </div>
    <app-input label="Stock" inputId="product-stock" formControlName="stock"
      inputMode="numeric" [errorMessages]="stockErrors" />
    <div class="product-form__actions">
      <app-button label="Create product" status="success" variant="ghost" type="submit"
        [disabled]="form.invalid || form.pending" />
      <app-button label="Cancel" status="error" variant="ghost" (pressed)="cancel()" />
    </div>
  </form>
  <p class="product-form__feedback" role="status" aria-live="polite">{{ feedback() }}</p>
  <app-modal [open]="cancelConfirmationOpen()" title="Leave this page?" (closed)="keepEditing()">
    <p class="product-form__modal-text">Are you sure you want to leave? Your unsaved changes will be permanently lost.</p>
    <div class="product-form__actions">
      <app-button label="Keep editing" variant="ghost" status="success" type="button" [autofocus]="true" (pressed)="keepEditing()" />
      <app-button label="Leave without saving" type="button" status="error" (pressed)="leaveWithoutSaving()" />
    </div>
  </app-modal>
</section>
