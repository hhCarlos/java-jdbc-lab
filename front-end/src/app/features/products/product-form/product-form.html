<section class="product-form" aria-label="New product details">
  <p class="product-form__instructions">All fields except description are required. Saving products is not available yet.</p>
  <form class="product-form__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="product-form__field">
      <label class="product-form__label" for="product-title">Title</label>
      <input class="product-form__input" id="product-title" name="title" formControlName="title" type="text" required
        [attr.aria-invalid]="showErrors('title') ? 'true' : null"
        [attr.aria-describedby]="showErrors('title') ? 'product-title-errors' : null" />
      @if (showErrors('title')) {
        <p class="product-form__errors" id="product-title-errors" aria-live="polite">{{ error('title') }}</p>
      }
    </div>
    <div class="product-form__field">
      <label class="product-form__label" for="product-price">Price</label>
      <input class="product-form__input" id="product-price" name="price" formControlName="price" type="text" required inputmode="decimal"
        [attr.aria-invalid]="showErrors('price') ? 'true' : null"
        [attr.aria-describedby]="showErrors('price') ? 'product-price-errors' : null" />
      @if (showErrors('price')) {
        <p class="product-form__errors" id="product-price-errors" aria-live="polite">{{ error('price') }}</p>
      }
    </div>
    <div class="product-form__field">
      <label class="product-form__label" for="product-description">Description (optional)</label>
      <textarea class="product-form__input" id="product-description" name="description" formControlName="description" rows="5"></textarea>
    </div>
    <div class="product-form__field">
      <label class="product-form__label" for="product-stock">Stock</label>
      <input class="product-form__input" id="product-stock" name="stock" formControlName="stock" type="text" required inputmode="numeric"
        [attr.aria-invalid]="showErrors('stock') ? 'true' : null"
        [attr.aria-describedby]="showErrors('stock') ? 'product-stock-errors' : null" />
      @if (showErrors('stock')) {
        <p class="product-form__errors" id="product-stock-errors" aria-live="polite">{{ error('stock') }}</p>
      }
    </div>
    <div class="product-form__actions">
      <app-button label="Create product" type="submit" />
      <app-button label="Cancel" (pressed)="cancel()" />
    </div>
  </form>
  <p class="product-form__feedback" role="status" aria-live="polite">{{ feedback() }}</p>
</section>
