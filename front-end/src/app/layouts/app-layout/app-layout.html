<div class="app-layout">
  <aside class="app-layout__sidebar">
    <div class="app-layout__logo" aria-hidden="true"></div>
    <nav class="app-layout__nav" aria-label="Main navigation">
      <a class="app-layout__link" routerLink="/app/products"
        routerLinkActive="app-layout__link--active" ariaCurrentWhenActive="page">Products</a>
      <a class="app-layout__link" routerLink="/app/profile"
        routerLinkActive="app-layout__link--active" ariaCurrentWhenActive="page">My Profile</a>
      <button class="app-layout__link app-layout__logout" type="button" (click)="logout()">Cerrar sesion</button>
    </nav>
  </aside>
  <main class="app-layout__main">
    <router-outlet />
  </main>
</div>
